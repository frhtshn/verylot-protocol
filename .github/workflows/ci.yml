name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test dotnet
      # Vectors must be reproducible from the reference implementation.
      - run: dotnet run tools/generate-vectors.cs > /tmp/v1.json && diff test-vectors/v1.json /tmp/v1.json

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/verifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
